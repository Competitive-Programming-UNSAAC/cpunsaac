<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Scoreboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="./vendor/bootstrap.min.css">
    <link rel="stylesheet" href="./vendor/fontawesome-all.min.css">
    <link rel="stylesheet" href="./style_domjudge.css">
    <script src="./vendor/bootstrap.bundle.min.js"></script>
</head>
<body class="static">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="mt-3" id="scoreboard-container"></div>
            </div>
        </div>
    </div>
    <script src="./scoreboard.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const contest = params.get('contest');
        if (contest) {
            ScoreboardRenderer.init({
                dataPath: '../data/' + contest,
                flagsPath: './flags/4x3'
            }).then(function() {
                document.title = document.querySelector('.card-header span[style]')?.textContent?.trim() + ' - Scoreboard' || 'Scoreboard';
            });
        } else {
            document.getElementById('scoreboard-container').innerHTML = '<p class="text-danger">No contest specified. Use ?contest=cuscontest-xxv</p>';
        }
    </script>
</body>
</html>
